            ~/Error loading class: de\/teamlapen\/vampirism\/client\/renderer\/entity\/layers\/VampirePlayerHeadLayer \(java\.lang\.ClassNotFoundException: de\.teamlapen\.vampirism\.client\.renderer\.entity\.layers\.VampirePlayerHeadLayer\)/,
            ~/Error loading class: de\/teamlapen\/werewolves\/client\/render\/layer\/HumanWerewolfLayer \(java\.lang\.ClassNotFoundException: de\.teamlapen\.werewolves\.client\.render\.layer\.HumanWerewolfLayer\)/
        ]

        def errors = []
        requiredMarkers.each { marker ->
            if (!logText.contains(marker)) {
                errors << "Missing required client log marker: ${marker}"
            }
        }
        forbiddenMarkers.each { marker ->
            if (logText.contains(marker)) {
                errors << "Client smoke log contains forbidden marker: ${marker}"
