tasks.matching { it.name in ['prepareRunServer', 'prepareRunServerCompile'] }.configureEach {
    dependsOn 'prepareVerificationRun'
}

tasks.register('prepareClientSmokeRun') {
    group = 'verification'
    description = 'Prepares a clean client smoke-test run directory with stable config defaults.'

    doLast {
        def runDirName = (findProperty('forgeRunDir') ?: 'run').toString()
        if (runDirName != verificationClientRunDirName) {
            return
        }

        def runDir = file(runDirName)
        def configDir = new File(runDir, 'config')

        mkdir(runDir)
        mkdir(configDir)

        copy {
            from file('gradle/run-defaults/config')
            into configDir
        }
    }
}

tasks.matching { it.name in ['prepareRunClient', 'prepareRunClientCompile'] }.configureEach {
    dependsOn 'prepareClientSmokeRun'
}

tasks.register('validateVerificationServerLog') {
    group = 'verification'
    description = 'Validates that the dedicated-server verification boot log stays free of known local regressions.'

    doLast {
        def runDirName = (findProperty('forgeRunDir') ?: verificationRunDirName).toString()
        def logFile = file("${runDirName}/logs/latest.log")
        if (!logFile.isFile()) {
            throw new GradleException("Verification server log not found: ${project.relativePath(logFile)}")
        }

        def logText = logFile.text
        def requiredMarkers = [
            'DedicatedServer/]: Done',
            '[statmod/]: STAT Mod ready on server'
        ]
        def forbiddenMarkers = [
            'Missing data pack mod:',
            'InputConstants$Key',
            'Configuration file .\\world\\serverconfig',
            'Incorrect key ',
            'Currently, statmod is not installed',
            'Found 2 mods for first modid statmod',
            'FAILED TO BIND TO PORT',
            'Address already in use: bind',
            'Failed to load eula.txt',
            'Encountered an unexpected exception',
            'Failed to start the minecraft server'
        ]
        def allowedWarningPatterns = [
            ~/Mod file .*javafmllanguage-1\.20\.1-47\.4\.20\.jar is missing mods\.toml file/,
            ~/Mod file .*lowcodelanguage-1\.20\.1-47\.4\.20\.jar is missing mods\.toml file/,
            ~/Mod file .*mclanguage-1\.20\.1-47\.4\.20\.jar is missing mods\.toml file/,
            ~/Mod file .*fmlcore-1\.20\.1-47\.4\.20\.jar is missing mods\.toml file/,
            ~/@Final field nextHeadUpdate:\[I in mixins\.epicfight\.json:common\.MixinWitherBoss should be final/,
            ~/@Final field idleHeadUpdates:\[I in mixins\.epicfight\.json:common\.MixinWitherBoss should be final/,
            ~/defineId called for: class net\.minecraft\.world\.entity\.LivingEntity from class yesman\.epicfight\.world\.capabilities\.entitypatch\.LivingEntityPatch/,
            ~/defineId called for: class net\.minecraft\.world\.entity\.player\.Player from class yesman\.epicfight\.world\.capabilities\.entitypatch\.player\.PlayerPatch/,
            ~/defineId called for: class net\.minecraft\.world\.entity\.boss\.wither\.WitherBoss from class yesman\.epicfight\.world\.capabilities\.entitypatch\.boss\.WitherPatch/,
            ~/Assets URL 'union:.*\/assets\/\.mcassetsroot' uses unexpected schema/,
            ~/Assets URL 'union:.*\/data\/\.mcassetsroot' uses unexpected schema/
        ]

        def errors = []
        requiredMarkers.each { marker ->
            if (!logText.contains(marker)) {
                errors << "Missing required log marker: ${marker}"
            }
        }
        forbiddenMarkers.each { marker ->
            if (logText.contains(marker)) {
                errors << "Verification log contains forbidden marker: ${marker}"
            }
        }
        logText.eachLine { line ->
            if (line.contains('[WARN]')) {
                def message = line.replaceFirst(/^.*?\]: /, '')
                if (!allowedWarningPatterns.any { pattern -> message ==~ pattern }) {
                    errors << "Verification log contains unexpected warning: ${message}"
                }
            }
        }

        if (!errors.isEmpty()) {
            throw new GradleException("Verification server log validation failed:\n - ${errors.join('\n - ')}")
        }

        println "Verification server log validation passed for ${project.relativePath(logFile)}."
    }
}

tasks.register('validateClientSmokeLog') {
    group = 'verification'
    description = 'Validates that the clean client smoke boot stays free of known local regressions.'

    doLast {
        def runDirName = (findProperty('forgeRunDir') ?: verificationClientRunDirName).toString()
