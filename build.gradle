            [
                'extends Skill',
                'super(builder)'
            ].each { required ->
                requireText(efnExampleAliasSkillSource, required, 'Epic Fight alias skill implementation')
            }
        }
        def epicFightFixPackFile = file('src/main/resources/packs/sihriya_epicfight_data_fixes/pack.mcmeta')
        requireFile(epicFightFixPackFile, 'Epic Fight built-in data fix pack metadata')
        if (epicFightFixPackFile.isFile()) {
            def epicFightFixPackSource = epicFightFixPackFile.text
            [
                '"pack_format": 15',
                'Sihriya Epic Fight data fixes',
                '"namespace": "efn"',
                'capabilities/weapons/scythe\\\\.json',
                '"namespace": "epicfight"',
                'capabilities/weapons/_diamond_greatsword\\\\.json'
            ].each { required ->
                requireText(epicFightFixPackSource, required, 'Epic Fight built-in data fix pack metadata')
            }
        }
        def customComboDemoOverrideFile = file('src/main/resources/packs/sihriya_epicfight_data_fixes/data/invincible/capabilities/weapons/types/custom_combo_demo.json')
        requireFile(customComboDemoOverrideFile, 'Invincible custom_combo_demo built-in override')
        if (customComboDemoOverrideFile.isFile()) {
            def customComboDemoOverrideSource = customComboDemoOverrideFile.text
            requireText(customComboDemoOverrideSource, '"hit_particle": "epicfight:hit_blunt"', 'Invincible custom_combo_demo built-in override')
            requireText(customComboDemoOverrideSource, '"hit_sound": "epicfight:entity.hit.blunt"', 'Invincible custom_combo_demo built-in override')
            if (customComboDemoOverrideSource.contains('"hit_particle": "blunt"')) {
                errors << 'Invincible custom_combo_demo built-in override must not use unqualified particle id blunt'
            }
        }
        def epicFightIntegrationFile = file('src/main/java/tong/sihriya/integration/EpicFightIntegration.java')
        requireFile(epicFightIntegrationFile, 'Epic Fight integration bootstrap')
        if (epicFightIntegrationFile.isFile()) {
            def epicFightIntegrationSource = epicFightIntegrationFile.text
            [
                'bootstrap(IEventBus modBus)',
                'AddPackFindersEvent',
                'PackType.SERVER_DATA',
                'Pack.Position.TOP',
                'sihriya_epicfight_data_fixes',
                'Pack.readMetaAndCreate',
                'Component.literal("Sihriya Epic Fight data fixes")'
            ].each { required ->
                requireText(epicFightIntegrationSource, required, 'Epic Fight integration bootstrap')
            }
        }
        def buildFile = file('build.gradle')
        requireText(buildFile.text, "workingDirectory project.file(findProperty('forgeRunDir') ?: 'run')", 'Sihriya build run configuration')
        requireText(buildFile.text, "tasks.register('prepareVerificationRun')", 'Sihriya verification run preparation')
        requireText(buildFile.text, "tasks.register('prepareClientSmokeRun')", 'Sihriya client smoke run preparation')
        requireText(buildFile.text, "tasks.register('prepareReleaseSmokeBundle')", 'Sihriya release smoke bundle preparation')
        requireText(buildFile.text, "tasks.register('validateVerificationServerLog')", 'Sihriya verification run preparation')
        requireText(buildFile.text, "tasks.register('validateClientSmokeLog')", 'Sihriya client smoke validation')
        requireText(buildFile.text, "tasks.register('validateReleaseArtifacts')", 'Sihriya release artifact validation')
        requireText(buildFile.text, "tasks.register('validateStandaloneReleaseServerSmoke')", 'Sihriya standalone release smoke validation')
        requireText(buildFile.text, "tasks.register('validateStandaloneReleaseClientSmoke')", 'Sihriya standalone release client smoke validation')
        requireText(buildFile.text, "verificationForgeServerPort = '25566'", 'Sihriya verification run preparation')
        requireText(buildFile.text, "gradle/run-defaults/defaultconfigs", 'Sihriya verification run preparation')
        requireText(buildFile.text, "gradle/run-defaults/config", 'Sihriya client smoke run preparation')
        requireText(buildFile.text, 'allowedWarningPatterns = [', 'Sihriya verification run preparation')
        requireText(buildFile.text, "Verification log contains unexpected warning", 'Sihriya verification run preparation')

        def standaloneReleaseSmokeScript = file('scripts/validate-standalone-release-server-smoke.ps1')
        requireFile(standaloneReleaseSmokeScript, 'Sihriya standalone release smoke script')
        if (standaloneReleaseSmokeScript.isFile()) {
            [
                'Start-Process',
                'forge-',
                '--installServer',
                'ProjectRoot',
                'epic-fight-20.14.17-mc1.20.1-forge.jar',
                'epic-fight-invincible-lib-20.14.8.2-mc1.20.1-forge.jar',
                'STAT Mod ready on server',
                'Done ('
            ].each { required ->
                requireText(standaloneReleaseSmokeScript.text, required, 'Sihriya standalone release smoke script')
            }
        }
        def standaloneReleaseClientSmokeScript = file('scripts/validate-standalone-release-client-smoke.ps1')
        requireFile(standaloneReleaseClientSmokeScript, 'Sihriya standalone release client smoke script')
        if (standaloneReleaseClientSmokeScript.isFile()) {
            [
                'Start-Process',
                '--installClient',
                'launcher_profiles.json',
                'ProjectRoot',
                'OpenAL initialized',
                'STAT Mod loaded!',
                'Sihriya chargé avec Epic Fight + STAT Mod !',
                'assets-link'
            ].each { required ->
                requireText(standaloneReleaseClientSmokeScript.text, required, 'Sihriya standalone release client smoke script')
            }
        }

        def defaultForgeServerConfig = file('gradle/run-defaults/defaultconfigs/forge-server.toml')
        requireFile(defaultForgeServerConfig, 'Sihriya Forge server default config')
        if (defaultForgeServerConfig.isFile()) {
            def defaultForgeServerConfigSource = defaultForgeServerConfig.text
            [
                '[server]',
                'removeErroringBlockEntities = false',
                'permissionHandler = "forge:default_handler"',
                'advertiseDedicatedServerToLan = true'
            ].each { required ->
                requireText(defaultForgeServerConfigSource, required, 'Sihriya Forge server default config')
            }
        }

        def defaultEpicFightServerConfig = file('gradle/run-defaults/defaultconfigs/epicfight-server.toml')
        requireFile(defaultEpicFightServerConfig, 'Sihriya Epic Fight server default config')
        if (defaultEpicFightServerConfig.isFile()) {
            requireText(defaultEpicFightServerConfig.text, 'allow_custom_animations = false', 'Sihriya Epic Fight server default config')
        }

        ['fml.toml', 'forge-client.toml', 'sihriya-client.toml', 'epicfight-common.toml', 'epicfight-client.toml', 'statmod-common.toml'].each { name ->
            requireFile(file("gradle/run-defaults/config/${name}"), "Sihriya client smoke default config ${name}")
        }

        def verificationWarningBaseline = file('docs/verification-warning-baseline.md')
        requireFile(verificationWarningBaseline, 'Sihriya verification warning baseline')
        if (verificationWarningBaseline.isFile()) {
            [
                'Verification Warning Baseline',
                'javafmllanguage',
                'lowcodelanguage',
                'mclanguage',
                'fmlcore',
                'MixinWitherBoss',
                'defineId called for',
                'unexpected schema',
                'run-clean/logs/latest.log'
            ].each { required ->
                requireText(verificationWarningBaseline.text, required, 'Sihriya verification warning baseline')
            }
        }
        def clientSmokeWarningBaseline = file('docs/client-smoke-warning-baseline.md')
        requireFile(clientSmokeWarningBaseline, 'Sihriya client smoke warning baseline')
        if (clientSmokeWarningBaseline.isFile()) {
            [
                'Client Smoke Warning Baseline',
                'validateClientSmokeLog',
                'run-client-clean/logs/latest.log',
                'Invalid path in pack',
                'Datapack animation reading failed',
                'Unable to load model'
            ].each { required ->
                requireText(clientSmokeWarningBaseline.text, required, 'Sihriya client smoke warning baseline')
            }
        }
        def releaseChecklist = file('docs/release-checklist.md')
        requireFile(releaseChecklist, 'Sihriya release checklist')
        if (releaseChecklist.isFile()) {
            [
                'Release Checklist',
                'validateClientAnimationPackaging',
                'validateClientSmokeLog',
                'validateVerificationServerLog',
                'validateReleaseArtifacts',
                'validateStandaloneReleaseServerSmoke',
                'validateStandaloneReleaseClientSmoke',
                'runClient -PforgeRunDir=run-client-clean --no-daemon',
                'runServer -PforgeRunDir=run-clean --no-daemon',
                'STAT Mod sibling revision',
                'build/libs'
            ].each { required ->
                requireText(releaseChecklist.text, required, 'Sihriya release checklist')
            }
        }
        def proReadinessAudit = file('docs/pro-readiness-audit.md')
        requireFile(proReadinessAudit, 'Sihriya pro readiness audit')
        if (proReadinessAudit.isFile()) {
            [
                'Pro Readiness Audit',
                'Proven now',
                'Tolerated upstream debt',
                'Not yet fully proven',
                'validateClientAnimationPackaging',
                'validateClientSmokeLog',
                'validateVerificationServerLog',
                'validateReleaseArtifacts',
                'validateStandaloneReleaseServerSmoke',
                'validateStandaloneReleaseClientSmoke',
                'runClient -PforgeRunDir=run-client-clean --no-daemon',
                'runServer -PforgeRunDir=run-clean --no-daemon'
            ].each { required ->
                requireText(proReadinessAudit.text, required, 'Sihriya pro readiness audit')
            }
        }
        def projectileFile = file('src/main/java/tong/sihriya/projectile/SpellProjectile.java')
        requireFile(projectileFile, 'Sihriya spell projectile entity')
        if (projectileFile.isFile()) {
            def projectileSource = projectileFile.text
            [
                'SynchedEntityData.defineId',
                'EntityDataSerializers.STRING',
                'EntityDataSerializers.FLOAT',
                'addAdditionalSaveData',
                'readAdditionalSaveData',
                'MAX_LIFETIME_TICKS',
                'public void tick()',
                'appliesIgnitionOnImpact'
            ].each { required ->
                requireText(projectileSource, required, 'Sihriya spell projectile entity')
            }
            if (projectileSource.contains('target.hurt(owner.damageSources().indirectMagic(this, owner), finalDamage);\n                        target.setRemainingFireTicks(100);')) {
                errors << 'Sihriya spell projectile must not ignite every target unconditionally'
            }
        }
        def entityRegistryFile = file('src/main/java/tong/sihriya/registry/SihriyaEntities.java')
        requireFile(entityRegistryFile, 'Sihriya entity registry')
        if (entityRegistryFile.isFile()) {
            def entityRegistry = entityRegistryFile.text
            if (entityRegistry.contains('tong.sihriya.client.')) {
                errors << 'Sihriya entity registry must not import classes from the client package'
            }
            requireText(entityRegistry, 'import tong.sihriya.magiccircle.MagicCircleEntity;', 'Sihriya entity registry')
        }
        requireFile(file('src/main/java/tong/sihriya/magiccircle/MagicCircleEntity.java'), 'common magic circle entity')
        def javaSourceDir = file('src/main/java/tong/sihriya')
        if (!javaSourceDir.isDirectory()) {
            errors << "Missing Sihriya Java source package: ${project.relativePath(javaSourceDir)}"
        } else {
            def unfinishedCodeMarkers = ['TODO', 'FIXME', 'XXX', 'HACK', 'stub', 'non implémenté', 'non implemente']
            fileTree(javaSourceDir).matching { include '**/*.java' }.each { javaSource ->
                def sourcePath = project.relativePath(javaSource).replace('\\', '/')
                def sourceText = javaSource.text
                unfinishedCodeMarkers.each { marker ->
                    if (sourceText.toLowerCase().contains(marker.toLowerCase())) {
                        errors << "${sourcePath} must not contain unfinished-code marker: ${marker}"
                    }
                }
                if (!sourcePath.contains('/client/')) {
                    ['tong.sihriya.client.', 'net.minecraft.client', 'net.minecraftforge.api.distmarker.OnlyIn', 'Dist.CLIENT'].each { forbidden ->
                        if (sourceText.contains(forbidden)) {
                            errors << "${sourcePath} is common code and must not reference client-only code directly: ${forbidden}"
                        }
                    }
                }
            }
        }
        def networkSourceDir = file('src/main/java/tong/sihriya/network')
        if (!networkSourceDir.isDirectory()) {
            errors << "Missing Sihriya network package: ${project.relativePath(networkSourceDir)}"
        } else {
            fileTree(networkSourceDir).matching { include '**/*.java' }.each { networkSource ->
                def sourceText = networkSource.text
                def sourceName = project.relativePath(networkSource)
                ['tong.sihriya.client.', 'net.minecraft.client', 'net.minecraftforge.api.distmarker.OnlyIn'].each { forbidden ->
                    if (sourceText.contains(forbidden)) {
                        errors << "${sourceName} must not reference client-only code directly: ${forbidden}"
                    }
                }
                if ((sourceText =~ /readUtf\(\s*\)/).find()) {
                    errors << "${sourceName} must bound every FriendlyByteBuf.readUtf call with NetworkInputRules"
                }
                sourceText.readLines().findAll { it.contains('writeUtf(') }.each { line ->
                    if (!line.contains('NetworkInputRules.')) {
                        errors << "${sourceName} must bound every FriendlyByteBuf.writeUtf call with NetworkInputRules"
                    }
                }
            }
        }
        def networkInputRulesFile = file('src/main/java/tong/sihriya/network/NetworkInputRules.java')
        requireFile(networkInputRulesFile, 'Sihriya network input rules')
        if (networkInputRulesFile.isFile()) {
            def networkRulesSource = networkInputRulesFile.text
            [
                'MAX_SCHOOL_ID_LENGTH',
                'MAX_SPELL_ID_LENGTH',
                'MAX_REASON_KEY_LENGTH',
                'MAX_SYNC_ENTRIES',
                'isValidSchoolId',
                'isValidSchoolIdSyntax',
                'isValidSpellId',
                'requireSchoolId',
                'requireOptionalSchoolId',
                'requireSpellId',
                'requireSyncEntryCount'
            ].each { required ->
                requireText(networkRulesSource, required, 'Sihriya network input rules')
            }
        }
        def schoolSyncPacketFile = file('src/main/java/tong/sihriya/network/SchoolSyncPacket.java')
        requireFile(schoolSyncPacketFile, 'Sihriya school sync packet')
        if (schoolSyncPacketFile.isFile()) {
            def schoolSyncPacketSource = schoolSyncPacketFile.text
            [
                'NetworkInputRules.requireOptionalSchoolId',
                'NetworkInputRules.requireSchoolId',
                'NetworkInputRules.requireSpellId',
                'NetworkInputRules.requireSyncEntryCount(packet.schoolLevels.size())',
                'NetworkInputRules.requireSyncEntryCount(packet.unlockedSchools.size())',
                'NetworkInputRules.requireSyncEntryCount(packet.learnedSpells.size())'
            ].each { required ->
                requireText(schoolSyncPacketSource, required, 'Sihriya school sync packet')
            }
        }
        def schoolCastPacketFile = file('src/main/java/tong/sihriya/network/SchoolCastPacket.java')
        requireFile(schoolCastPacketFile, 'Sihriya school cast packet')
        if (schoolCastPacketFile.isFile()) {
            def schoolCastPacketSource = schoolCastPacketFile.text
            requireText(schoolCastPacketSource, 'NetworkInputRules.isValidSchoolId(packet.schoolId, id -> SchoolRegistry.get(id) != null)', 'Sihriya school cast packet')
            requireText(schoolCastPacketSource, 'buf.readUtf(NetworkInputRules.MAX_SCHOOL_ID_LENGTH)', 'Sihriya school cast packet')
            requireText(schoolCastPacketSource, 'buf.writeUtf(packet.schoolId, NetworkInputRules.MAX_SCHOOL_ID_LENGTH)', 'Sihriya school cast packet')
        }
        requireText(file('build.gradle').text, "tasks.register('validateClientAnimationPackaging')", 'Sihriya build script')

        def modsTomlFile = file('src/main/resources/META-INF/mods.toml')
        requireFile(modsTomlFile, 'Forge mods.toml')
        if (modsTomlFile.isFile()) {
            def modsToml = modsTomlFile.text
            requireText(modsToml, 'modLoader="javafml"', 'mods.toml')
            requireText(modsToml, 'loaderVersion="${loader_version_range}"', 'mods.toml')
            requireText(modsToml, 'license="${mod_license}"', 'mods.toml')
            requireText(modsToml, 'modId="${mod_id}"', 'mods.toml')
            requireText(modsToml, 'version="${mod_version}"', 'mods.toml')
            requireText(modsToml, 'displayName="${mod_name}"', 'mods.toml')
            requireText(modsToml, 'authors="${mod_authors}"', 'mods.toml')
            ['forge', 'minecraft', 'epicfight', 'statmod'].each { dependency ->
                requireRegex(
                    modsToml,
                    /(?s)\[\[dependencies\.\$\{mod_id\}\]\].*?modId="${dependency}".*?mandatory=true.*?side="BOTH"/,
                    "mods.toml must declare mandatory BOTH dependency ${dependency}"
                )
            }
        }

        def packFile = file('src/main/resources/pack.mcmeta')
        requireFile(packFile, 'pack.mcmeta')
        if (packFile.isFile()) {
            def pack = new JsonSlurper().parse(packFile)
            if (!(pack.pack instanceof Map)) errors << 'pack.mcmeta must contain a pack object'
            if (pack.pack?.pack_format != 15) errors << "pack.mcmeta pack_format must be 15 for Minecraft 1.20.1, found ${pack.pack?.pack_format}"
            if (!pack.pack?.description?.toString()?.contains('Sihriya')) errors << 'pack.mcmeta description must identify Sihriya'
        }

        if (file('LICENSE').isFile()) {
            requireText(file('LICENSE').text, mod_license.toString(), 'LICENSE')
        }
        if (file('README.md').isFile()) {
            def readme = file('README.md').text
            ['Sihriya', 'Minecraft 1.20.1', 'Forge', 'Epic Fight', 'STAT Mod', '252', 'validateClientAnimationPackaging', 'validateClientSmokeLog', 'validateVerificationServerLog', 'validateReleaseArtifacts', 'validateStandaloneReleaseServerSmoke', 'validateStandaloneReleaseClientSmoke', 'prepareReleaseSmokeBundle', 'runClient -PforgeRunDir=run-client-clean --no-daemon', 'runServer -PforgeRunDir=run-clean --no-daemon', 'docs/client-smoke-warning-baseline.md', 'docs/pro-readiness-audit.md'].each { required ->
                requireText(readme, required, 'README')
            }
        }
        if (file('CHANGELOG.md').isFile()) {
            requireText(file('CHANGELOG.md').text, mod_version.toString(), 'CHANGELOG')
        }

        if (!errors.isEmpty()) {
            throw new GradleException("Sihriya packaging validation failed:\n - ${errors.join('\n - ')}")
        }
        println "Sihriya packaging validation passed: ${mod_id} ${mod_version}."
    }
}

tasks.named('check') {
    dependsOn 'validateSihriyaContent', 'validateSihriyaPackaging', 'validateClientAnimationPackaging', 'validateReleaseArtifacts', 'validateStandaloneReleaseClientSmoke'
}

// Désactiver JarInJar — Epic Fight Nightfall embarque AAA Particles incompatible
jarJar {
    disable()
}

// Supprimer les dépendances embarquées incompatibles du cache deobf avant runClient
tasks.register('cleanDeobfCache', Delete) {
    doFirst {
        def deobfBase = file("${gradle.gradleUserHomeDir}/caches/forge_gradle/deobf_dependencies/blank")
        delete fileTree(deobfBase) {
            include "aaa_particles-forge-1.20.1-2.2.1-beta.2/**"
            include "epicfight-nightfall-3.3.3-all/**"
            include "epic-fight-invincible-lib-20.14.8.2-mc1.20.1-forge/**"
            include "epic-fight-invincible-lib-20.14.7.5-mc1.20.1-forge/**"
        }
        def deobfCurse = file("${gradle.gradleUserHomeDir}/caches/forge_gradle/deobf_dependencies/curse/maven")
        delete fileTree(deobfCurse) {
            include "epicfight-nightfall-1307848/**"
            include "epic-fight-avalon-1268823/**"
        }
    }
}

tasks.matching { it.name == 'runClient' }.configureEach {
    dependsOn 'cleanDeobfCache'
}

// Supprimer les JARs incompatibles juste avant le lancement du jeu
afterEvaluate {
    tasks.findByName('runClient')?.doFirst {
        def cacheDir = file("${gradle.gradleUserHomeDir}/caches/forge_gradle/deobf_dependencies/blank")
        ['aaa_particles-forge-1.20.1-2.2.1-beta.2', 'epicfight-nightfall-3.3.3-all',
         'epic-fight-invincible-lib-20.14.8.2-mc1.20.1-forge', 'epic-fight-invincible-lib-20.14.7.5-mc1.20.1-forge'].each {
            def d = new File(cacheDir, it); if (d.exists()) { d.deleteDir(); println "Cleaned: ${it}" }
        }
        def curseDir = file("${gradle.gradleUserHomeDir}/caches/forge_gradle/deobf_dependencies/curse/maven")
        ['epic-fight-avalon-1268823'].each {
            def d = new File(curseDir, it); if (d.exists()) { d.deleteDir(); println "Cleaned: ${it}" }
        }
    }
    tasks.findByName('runServer')?.doFirst {
        def cacheDir = file("${gradle.gradleUserHomeDir}/caches/forge_gradle/deobf_dependencies/blank")
        ['aaa_particles-forge-1.20.1-2.2.1-beta.2', 'epicfight-nightfall-3.3.3-all',
         'epic-fight-invincible-lib-20.14.8.2-mc1.20.1-forge', 'epic-fight-invincible-lib-20.14.7.5-mc1.20.1-forge'].each {
            def d = new File(cacheDir, it); if (d.exists()) { d.deleteDir(); println "Cleaned: ${it}" }
        }
        def curseDir = file("${gradle.gradleUserHomeDir}/caches/forge_gradle/deobf_dependencies/curse/maven")
        ['epic-fight-avalon-1268823'].each {
            def d = new File(curseDir, it); if (d.exists()) { d.deleteDir(); println "Cleaned: ${it}" }
        }
    }
}
