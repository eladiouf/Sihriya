            [
                'createRegistryWorker("efn")',
                'worker.build("example"',
                'ResourceLocation.fromNamespaceAndPath("efn", "example")',
                'SkillCategories.WEAPON_INNATE',
                '@SubscribeEvent(priority = EventPriority.HIGHEST)'
            ].each { required ->
