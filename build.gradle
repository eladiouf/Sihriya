plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

import groovy.json.JsonSlurper
import org.gradle.api.file.DuplicatesStrategy
import org.gradle.api.tasks.bundling.Zip

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file(findProperty('forgeRunDir') ?: 'run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    flatDir { dir 'libs' }
    maven { name = 'ParchmentMC'; url = 'https://maven.parchmentmc.org' }
    maven { url "https://cursemaven.com"; content { includeGroup "curse.maven" } }
    maven { name = "Modrinth"; url = "https://api.modrinth.com/maven"; content { includeGroup "maven.modrinth" } }
}

def verificationRunDirName = 'run-clean'
def verificationClientRunDirName = 'run-client-clean'
def defaultForgeServerPort = '25565'
def verificationForgeServerPort = '25566'
def animationRegistrySourceFile = file('src/main/java/tong/sihriya/animation/SihriyaAnimations.java')
def animationResourcePrefix = "assets/${mod_id}/animmodels/animations/".toString()
def registeredAnimationRelativePaths = providers.provider {
    if (!animationRegistrySourceFile.isFile()) {
        return [] as Set
    }
    ((animationRegistrySourceFile.text =~ /register\(builder,\s*"[^"]+",\s*"([^"]+)"/)
        .collect { "${it[1].replace('\\', '/')}.json".toString() } as Set)
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Epic Fight (local JAR — transitive=false pour éviter aaa_particles/nightfall/invincible/avalon)
    implementation(fg.deobf("blank:epic-fight-20.14.17-mc1.20.1-forge:20.14.17")) {
        transitive = false
    }

    // STAT Mod (sibling project) - compile against the sibling project and load it as a regular runtime mod
    implementation project(':STAT_MOD')

    // Iron's Spells 'n Spellbooks (optional — compileOnly, détection runtime via Class.forName)
    compileOnly fg.deobf("curse.maven:irons-spells-n-spellbooks-855414:7907340")

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

