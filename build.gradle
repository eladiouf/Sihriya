tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
    doLast {
        def packagedBase = file("$destinationDir/${animationResourcePrefix}")
        if (!packagedBase.isDirectory()) {
            return
        }
        delete(packagedBase)
        def sourceBase = file("src/main/resources/${animationResourcePrefix}")
        registeredAnimationRelativePaths.get().each { relativePath ->
            def sourceFile = new File(sourceBase, relativePath.replace('/' as char, File.separatorChar))
            if (sourceFile.isFile()) {
                copy {
                    from sourceFile
                    into new File(packagedBase, relativePath.substring(0, Math.max(relativePath.lastIndexOf('/'), 0)))
                }
            }
        }
    }
}

tasks.register('validateClientAnimationPackaging') {
    group = 'verification'
    description = 'Validates that packaged client animation resources only ship registered Epic Fight animation payloads.'
    dependsOn 'processResources'

    doLast {
        def packagedBase = file("$buildDir/resources/main/assets/${mod_id}/animmodels/animations")
        if (!packagedBase.isDirectory()) {
            throw new GradleException("Packaged animation directory not found: ${project.relativePath(packagedBase)}")
        }

        def registeredPaths = registeredAnimationRelativePaths.get() as Set
        def packagedPaths = (fileTree(packagedBase).matching { include '**/*.json' }.files.collect { resource ->
            resource.path.substring(packagedBase.path.length() + 1).replace(File.separatorChar, '/' as char)
        } as Set)

        def invalidPackagedPaths = packagedPaths.findAll { path ->
            path.split('/').any { segment -> !(segment ==~ /[a-z0-9._-]+/) }
        }
        def unexpectedPaths = packagedPaths.findAll { !(it in registeredPaths) }
        def errors = []
        if (packagedPaths.isEmpty()) {
            errors << 'Packaged animation resources are unexpectedly empty'
        }
        if (!invalidPackagedPaths.isEmpty()) {
            errors << "Packaged animation resources contain invalid resource paths, sample: ${invalidPackagedPaths.take(10)}"
        }
        if (!unexpectedPaths.isEmpty()) {
            errors << "Packaged animation resources contain unregistered payloads, sample: ${unexpectedPaths.take(10)}"
        }
        if (!errors.isEmpty()) {
            throw new GradleException("Client animation packaging validation failed:\n - ${errors.join('\n - ')}")
        }

        println "Client animation packaging validation passed with ${packagedPaths.size()} packaged animation payloads."
    }
}

tasks.register('prepareStatModReleaseJar', Zip) {
    group = 'verification'
    description = 'Merges the reobfuscated STAT Mod classes with the source jar resources into a single release jar.'
    dependsOn ':STAT_MOD:jar', ':STAT_MOD:reobfJar'

    def statModJarName = project(':STAT_MOD').tasks.named('jar', Jar).get().archiveFileName.get()
    archiveFileName.set(statModJarName)
    destinationDirectory.set(layout.buildDirectory.dir('statmod-release'))
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    includeEmptyDirs = false

    from({ zipTree(project(':STAT_MOD').file('build/reobfJar/output.jar')) })
    from({ zipTree(project(':STAT_MOD').file("build/libs/${statModJarName}")) }) {
        exclude '**/*.class'
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.DSA'
        exclude 'META-INF/*.RSA'
    }
}

tasks.register('prepareReleaseSmokeBundle') {
    group = 'verification'
    description = 'Stages the built Sihriya and STAT Mod jars plus stable defaults into a standalone release-smoke bundle.'
    dependsOn 'reobfJar', 'prepareStatModReleaseJar'

    doLast {
        def bundleDir = file("$buildDir/release-smoke")
        def modsDir = new File(bundleDir, 'mods')
        def configDir = new File(bundleDir, 'config')
        def defaultConfigsDir = new File(bundleDir, 'defaultconfigs')
        def sihriyaJarFile = file("$buildDir/reobfJar/output.jar")
        def statModJarFile = file("$buildDir/statmod-release/${project(':STAT_MOD').tasks.named('jar', Jar).get().archiveFileName.get()}")
        def sihriyaBundleJarName = tasks.named('jar', Jar).get().archiveFileName.get()
        def statModBundleJarName = project(':STAT_MOD').tasks.named('jar', Jar).get().archiveFileName.get()
        delete(bundleDir)
        mkdir(modsDir)
        mkdir(configDir)
        mkdir(defaultConfigsDir)

        copy {
            from sihriyaJarFile
            into modsDir
            rename { sihriyaBundleJarName }
        }
        copy {
            from statModJarFile
            into modsDir
            rename { statModBundleJarName }
        }
        copy {
            from file('gradle/run-defaults/config')
            into configDir
        }
        copy {
            from file('gradle/run-defaults/defaultconfigs')
            into defaultConfigsDir
        }

        def readme = new File(bundleDir, 'README-release-smoke.txt')
        readme.text = """Release smoke bundle for Sihriya verification

mods/
  - ${sihriyaBundleJarName} (from build/reobfJar/output.jar)
                - ${statModBundleJarName} (from merged STAT Mod release jar)

config/
  - stable client/common defaults captured from verification runs

defaultconfigs/
  - stable dedicated-server defaults captured from verification runs
"""
    }
}

tasks.register('validateReleaseArtifacts') {
    group = 'verification'
    description = 'Validates the built Sihriya and STAT Mod jars and the staged release-smoke bundle.'
    dependsOn 'prepareReleaseSmokeBundle'

    doLast {
        def errors = []
        def sihriyaJar = file("$buildDir/reobfJar/output.jar")
        def statModJar = file("$buildDir/statmod-release/${project(':STAT_MOD').tasks.named('jar', Jar).get().archiveFileName.get()}")
        def sihriyaBundleJarName = tasks.named('jar', Jar).get().archiveFileName.get()
        def statModBundleJarName = project(':STAT_MOD').tasks.named('jar', Jar).get().archiveFileName.get()
        def bundleDir = file("$buildDir/release-smoke")
        def bundleModsDir = new File(bundleDir, 'mods')
        def bundledSihriyaJar = new File(bundleModsDir, sihriyaBundleJarName)
        def bundledStatModJar = new File(bundleModsDir, statModBundleJarName)

        def collectEntries = { File jarFile ->
            def zip = new java.util.zip.ZipFile(jarFile)
            try {
                zip.entries().collect { it.name } as Set
            } finally {
                zip.close()
            }
        }

        def sameFileContent = { File left, File right ->
            if (!left.isFile() || !right.isFile() || left.length() != right.length()) {
                return false
            }
            left.bytes == right.bytes
        }

        def requireJarEntry = { Set entries, String entry, String label ->
            if (!(entry in entries)) {
                errors << "${label} is missing required entry: ${entry}"
            }
        }

        def forbidJarEntryPrefix = { Set entries, String prefix, String label ->
            if (entries.any { it.startsWith(prefix) }) {
                errors << "${label} contains forbidden entry prefix: ${prefix}"
            }
        }

        if (!sihriyaJar.isFile()) {
            errors << "Missing built Sihriya jar: ${project.relativePath(sihriyaJar)}"
        } else {
            def entries = collectEntries(sihriyaJar)
            [
                'META-INF/mods.toml',
                'pack.mcmeta',
                'data/sihriya/schools.json',
                'data/sihriya/spells.json',
                'data/sihriya/sihriya_spell_animations/schools.json',
                'packs/sihriya_epicfight_data_fixes/pack.mcmeta'
            ].each { entry ->
                requireJarEntry(entries, entry, 'Sihriya release jar')
            }
            forbidJarEntryPrefix(entries, 'assets/sihriya/animmodels/animations/Battle-Arts/', 'Sihriya release jar')
            forbidJarEntryPrefix(entries, 'assets/sihriya/animmodels/animations/spells/Breath_Loop.json', 'Sihriya release jar')
            forbidJarEntryPrefix(entries, 'assets/sihriya/animmodels/animations/spells/breath_preparation.json', 'Sihriya release jar')

            def animationEntries = entries.findAll { it.startsWith('assets/sihriya/animmodels/animations/') && it.endsWith('.json') }
            if (animationEntries.size() != 154) {
                errors << "Sihriya release jar must package exactly 154 animation payload json files, found ${animationEntries.size()}"
            }
        }

        if (!statModJar.isFile()) {
            errors << "Missing built STAT Mod jar: ${project.relativePath(statModJar)}"
        } else {
            def entries = collectEntries(statModJar)
            [
                'META-INF/mods.toml',
                'assets/statmod/models/item/class_arts.json',
                'assets/statmod/models/item/stat_scroll.json',
                'assets/statmod/models/item/perk_tome.json',
                'assets/statmod/models/item/mastery_crystal.json',
                'data/forge/loot_modifiers/global_loot_modifiers.json'
            ].each { entry ->
                requireJarEntry(entries, entry, 'STAT Mod release jar')
            }
        }

        if (!bundleModsDir.isDirectory()) {
            errors << "Missing release smoke bundle mods directory: ${project.relativePath(bundleModsDir)}"
        } else {
            def modJars = fileTree(bundleModsDir).matching { include '*.jar' }.files*.name as Set
            if (!(sihriyaBundleJarName in modJars)) {
                errors << "Release smoke bundle is missing ${sihriyaBundleJarName}"
            }
            if (!(statModBundleJarName in modJars)) {
                errors << "Release smoke bundle is missing ${statModBundleJarName}"
            }
            if (!sameFileContent(bundledSihriyaJar, sihriyaJar)) {
                errors << "Release smoke bundle must stage the reobfuscated Sihriya jar from ${project.relativePath(sihriyaJar)}"
            }
            if (!sameFileContent(bundledStatModJar, statModJar)) {
                errors << "Release smoke bundle must stage the reobfuscated STAT Mod jar from ${project.relativePath(statModJar)}"
            }
        }

        ['README-release-smoke.txt', 'config/fml.toml', 'config/epicfight-client.toml', 'defaultconfigs/forge-server.toml'].each { relativePath ->
            def target = new File(bundleDir, relativePath)
            if (!target.isFile()) {
                errors << "Release smoke bundle is missing ${project.relativePath(target)}"
            }
        }

        if (!errors.isEmpty()) {
            throw new GradleException("Release artifact validation failed:\n - ${errors.join('\n - ')}")
        }

        println "Release artifact validation passed for ${sihriyaBundleJarName} and ${statModBundleJarName}."
    }
}

tasks.register('validateStandaloneReleaseServerSmoke') {
    group = 'verification'
    description = 'Boots a standalone Forge server install from the staged release-smoke bundle and validates startup markers.'
    dependsOn 'validateReleaseArtifacts'

    doLast {
        def smokeScript = file('scripts/validate-standalone-release-server-smoke.ps1')
        if (!smokeScript.isFile()) {
            throw new GradleException("Missing standalone release smoke script: ${project.relativePath(smokeScript)}")
        }

        exec {
            commandLine 'powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass',
                '-File', smokeScript.absolutePath,
                '-ProjectRoot', projectDir.absolutePath,
                '-BundleDir', file("$buildDir/release-smoke").absolutePath,
                '-StandaloneDir', file("$buildDir/standalone-server").absolutePath,
                '-MinecraftVersion', minecraft_version,
                '-ForgeVersion', forge_version,
                '-ServerPort', '25567'
        }
    }
}

tasks.register('validateStandaloneReleaseClientSmoke') {
    group = 'verification'
    description = 'Boots a standalone Forge client install from the staged release-smoke bundle and validates client startup markers.'
    dependsOn 'validateReleaseArtifacts'

    doLast {
        def smokeScript = file('scripts/validate-standalone-release-client-smoke.ps1')
        if (!smokeScript.isFile()) {
            throw new GradleException("Missing standalone release client smoke script: ${project.relativePath(smokeScript)}")
        }

        exec {
            commandLine 'powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass',
                '-File', smokeScript.absolutePath,
                '-ProjectRoot', projectDir.absolutePath,
                '-BundleDir', file("$buildDir/release-smoke").absolutePath,
                '-StandaloneDir', file("$buildDir/standalone-client").absolutePath,
                '-MinecraftVersion', minecraft_version,
                '-ForgeVersion', forge_version
        }
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) { artifact jar }
    }
    repositories {
        maven { url "file://${project.projectDir}/mcmodsrepo" }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('validateSihriyaContent') {
    group = 'verification'
    description = 'Validates Sihriya data, translations, and critical assets.'

    doLast {
        def json = new JsonSlurper()
        def errors = []
        def resources = file('src/main/resources')
        def expectedSchools = ['fire', 'water', 'wind', 'earth', 'lightning', 'ice', 'lava', 'necromancy', 'lumamancy']
        def expectedTierCounts = [1: 6, 2: 8, 3: 8, 4: 4, 5: 2]
        def allowedSpellTypes = ['PROJECTILE', 'ZONE', 'BUFF', 'SUMMON', 'ULTIMATE'] as Set
        def animationFields = ['chant_animation', 'cast_animation', 'continuous_animation', 'staff_chant', 'staff_cast']

        def requireFile = { File f, String label ->
            if (!f.isFile()) {
                errors << "Missing ${label}: ${project.relativePath(f)}"
            }
        }

        def schoolsFile = file('src/main/resources/data/sihriya/schools.json')
        def spellsFile = file('src/main/resources/data/sihriya/spells.json')
        requireFile(schoolsFile, 'schools data')
        requireFile(spellsFile, 'spells data')
        if (!errors.isEmpty()) {
            throw new GradleException("Sihriya content validation failed:\n - ${errors.join('\n - ')}")
        }

        def schools = json.parse(schoolsFile)
        def spells = json.parse(spellsFile)

        if (!(schools instanceof List)) errors << 'schools.json must be a JSON array'
        if (!(spells instanceof List)) errors << 'spells.json must be a JSON array'
        if (!errors.isEmpty()) {
            throw new GradleException("Sihriya content validation failed:\n - ${errors.join('\n - ')}")
        }

        def schoolIds = schools.collect { it.id }
        if (schoolIds != expectedSchools) {
            errors << "Expected schools ${expectedSchools}, found ${schoolIds}"
        }
        if (schoolIds.toSet().size() != schoolIds.size()) {
            errors << 'Duplicate school ids in schools.json'
        }
        schools.each { school ->
            if (!(school.id ==~ /[a-z0-9_]+/)) errors << "Invalid school id: ${school.id}"
            if (!(school.color ==~ /[0-9A-Fa-f]{6}/)) errors << "Invalid color for school ${school.id}: ${school.color}"
            if (school.unlock != null) {
                if (!(school.unlock.type in ['level', 'and', 'or'])) errors << "Invalid unlock type for school ${school.id}: ${school.unlock.type}"
                if (!(school.unlock.schoolIds instanceof List) || !(school.unlock.levels instanceof List)) {
                    errors << "Unlock for ${school.id} must define schoolIds and levels arrays"
                } else if (school.unlock.schoolIds.size() != school.unlock.levels.size()) {
                    errors << "Unlock for ${school.id} has mismatched schoolIds and levels"
                } else {
                    school.unlock.schoolIds.each { ref ->
                        if (!(ref in expectedSchools)) errors << "Unlock for ${school.id} references unknown school ${ref}"
                    }
                    school.unlock.levels.each { level ->
                        if (!(level instanceof Number) || level < 0 || level > 100) errors << "Unlock for ${school.id} has invalid level ${level}"
                    }
                }
            }
        }

        if (spells.size() != 252) errors << "Expected 252 spells, found ${spells.size()}"
        def spellIds = spells.collect { it.id }
        if (spellIds.toSet().size() != spellIds.size()) errors << 'Duplicate spell ids in spells.json'

        spells.each { spell ->
            if (!(spell.id ==~ /[a-z0-9_]+\.[a-z0-9_]+/)) errors << "Invalid spell id: ${spell.id}"
            if (!(spell.school in expectedSchools)) errors << "Spell ${spell.id} references unknown school ${spell.school}"
            if (!spell.id.startsWith("${spell.school}.")) errors << "Spell ${spell.id} does not start with its school '${spell.school}.'"
            if (!(spell.tier instanceof Number) || spell.tier < 1 || spell.tier > 5) errors << "Spell ${spell.id} has invalid tier ${spell.tier}"
            if (!(spell.manaCost instanceof Number) || spell.manaCost < 0) errors << "Spell ${spell.id} has invalid manaCost ${spell.manaCost}"
            if (!(spell.cooldown instanceof Number) || spell.cooldown < 0) errors << "Spell ${spell.id} has invalid cooldown ${spell.cooldown}"
            if (!(spell.castTime instanceof Number) || spell.castTime < 0) errors << "Spell ${spell.id} has invalid castTime ${spell.castTime}"
            if (!(spell.type in allowedSpellTypes)) errors << "Spell ${spell.id} has invalid type ${spell.type}"
            if (!(spell.effects instanceof List) || spell.effects.isEmpty()) {
                errors << "Spell ${spell.id} must define at least one effect"
            } else {
                spell.effects.eachWithIndex { effect, index ->
                    if (!(effect.type ==~ /[a-z0-9_]+/)) errors << "Spell ${spell.id} effect ${index} has invalid type ${effect.type}"
                    if (!(effect.baseValue instanceof Number)) errors << "Spell ${spell.id} effect ${effect.type} has invalid baseValue"
                    if (!(effect.scaling instanceof Number)) errors << "Spell ${spell.id} effect ${effect.type} has invalid scaling"
                    if (!(effect.duration instanceof Number) || effect.duration < 0) errors << "Spell ${spell.id} effect ${effect.type} has invalid duration ${effect.duration}"
                }
            }
        }

        expectedSchools.each { school ->
            def schoolSpells = spells.findAll { it.school == school }
            if (schoolSpells.size() != 28) errors << "Expected 28 spells for ${school}, found ${schoolSpells.size()}"
            expectedTierCounts.each { tier, count ->
                def actual = schoolSpells.count { it.tier == tier }
                if (actual != count) errors << "Expected ${count} tier ${tier} spells for ${school}, found ${actual}"
            }
        }

        ['en_us', 'fr_fr'].each { locale ->
            requireFile(file("src/main/resources/assets/sihriya/lang/${locale}.json"), "${locale} translations")
        }
        def en = json.parse(file('src/main/resources/assets/sihriya/lang/en_us.json'))
        def fr = json.parse(file('src/main/resources/assets/sihriya/lang/fr_fr.json'))
        def enKeys = en.keySet().collect { it.toString() } as Set
        def frKeys = fr.keySet().collect { it.toString() } as Set
        if (enKeys != frKeys) {
            errors << "Translation keys differ. Missing FR: ${(enKeys - frKeys).sort()}; missing EN: ${(frKeys - enKeys).sort()}"
        }
        expectedSchools.each { school ->
            def key = "sihriya.school.${school}".toString()
            if (!enKeys.contains(key)) errors << "Missing school translation key ${key}"
        }
        ['projectile', 'zone', 'buff', 'summon', 'ultimate'].each { type ->
            def key = "sihriya.spell_type.${type}".toString()
            if (!enKeys.contains(key)) errors << "Missing spell type translation key ${key}"
        }

        expectedSchools.each { school ->
            (0..3).each { layer ->
                requireFile(file("src/main/resources/assets/sihriya/textures/magiccircle/${school}_${layer}.png"), "${school} magic circle layer ${layer}")
            }
            requireFile(file("src/main/resources/assets/sihriya/textures/particle/glow_spark_${school}.png"), "${school} particle texture")
        }
        ['fire', 'water', 'wind', 'earth', 'lightning', 'ice', 'lava'].each { school ->
            requireFile(file("src/main/resources/assets/sihriya/particles/${school}_glow.json"), "${school} particle definition")
        }
        ['necro_glow', 'lumi_glow'].each { particle ->
            requireFile(file("src/main/resources/assets/sihriya/particles/${particle}.json"), "${particle} particle definition")
        }
        requireFile(file('src/main/resources/assets/sihriya/textures/gui/spell_icons.png'), 'spell icon atlas')
        def spellIconMapFile = file('src/main/resources/assets/sihriya/textures/gui/spell_icon_map.json')
        requireFile(spellIconMapFile, 'spell icon map')

        if (spellIconMapFile.isFile()) {
            def iconMap = json.parse(spellIconMapFile)
            if (!(iconMap instanceof Map)) {
                errors << 'spell_icon_map.json must be a JSON object keyed by spell id'
            } else {
                def iconIds = iconMap.keySet().collect { it.toString() } as Set
                def spellIdSet = spellIds.collect { it.toString() } as Set
                def missingIcons = (spellIdSet - iconIds).sort()
                def extraIcons = (iconIds - spellIdSet).sort()
                if (!missingIcons.isEmpty()) errors << "Missing spell icon mappings: ${missingIcons}"
                if (!extraIcons.isEmpty()) errors << "Spell icon map contains unknown spell ids: ${extraIcons}"

                expectedSchools.eachWithIndex { school, expectedRow ->
                    def schoolIconEntries = iconMap.findAll { id, entry -> id.toString().startsWith("${school}.") }
                    def cols = schoolIconEntries.collect { id, entry -> entry.col }
                    if (schoolIconEntries.size() != 28) errors << "Expected 28 icon mappings for ${school}, found ${schoolIconEntries.size()}"
                    if ((cols as Set).size() != cols.size()) errors << "Duplicate icon atlas columns for ${school}"
                    schoolIconEntries.each { id, entry ->
                        if (!(entry instanceof Map)) {
                            errors << "Icon mapping for ${id} must be a JSON object"
                            return
                        }
                        if (entry.school != school) errors << "Icon mapping ${id} has school ${entry.school}, expected ${school}"
                        if (!(entry.row instanceof Number) || entry.row != expectedRow) errors << "Icon mapping ${id} has row ${entry.row}, expected ${expectedRow}"
                        if (!(entry.col instanceof Number) || entry.col < 0 || entry.col > 27) errors << "Icon mapping ${id} has invalid col ${entry.col}"
                        if (!(entry.x instanceof Number) || entry.x != entry.col * 32) errors << "Icon mapping ${id} has x ${entry.x}, expected ${entry.col * 32}"
                        if (!(entry.y instanceof Number) || entry.y != entry.row * 32) errors << "Icon mapping ${id} has y ${entry.y}, expected ${entry.row * 32}"
                        ['u', 'v', 'w', 'h'].each { field ->
                            if (!(entry[field] instanceof Number) || entry[field] < 0 || entry[field] > 1) {
                                errors << "Icon mapping ${id} has invalid ${field} ${entry[field]}"
                            }
                        }
                    }
                }
            }
        }

        def spellAnimationsFile = file('src/main/resources/data/sihriya/sihriya_spell_animations/schools.json')
        requireFile(spellAnimationsFile, 'spell animation mappings')
        def animationRegistryFile = file('src/main/java/tong/sihriya/animation/SihriyaAnimations.java')
        requireFile(animationRegistryFile, 'Sihriya animation registry')

        if (spellAnimationsFile.isFile() && animationRegistryFile.isFile()) {
            def spellAnimations = json.parse(spellAnimationsFile)
            def animationRegistrySource = animationRegistryFile.text
            def registeredAnimations = [:]
            (animationRegistrySource =~ /register\(builder,\s*"([^"]+)",\s*"([^"]+)"/).each { match ->
                registeredAnimations[match[1]] = match[2]
            }

            if (!(spellAnimations instanceof Map) || !(spellAnimations.spells instanceof Map)) {
                errors << 'sihriya_spell_animations/schools.json must contain a spells object'
            } else {
                def animationMappings = spellAnimations.spells
                def animationKeys = animationMappings.keySet().collect { it.toString() } as Set
                if (!animationKeys.contains('default')) errors << 'Spell animation mappings must define a default fallback'
                expectedSchools.each { school ->
                    def schoolKey = "__${school}__".toString()
                    if (!animationKeys.contains(schoolKey)) errors << "Spell animation mappings must define fallback ${schoolKey}"
                }
                def invalidAnimationKeys = (animationKeys.findAll {
                    it != 'default' && !it.startsWith('__') && !(it in spellIds)
                }).sort()
                if (!invalidAnimationKeys.isEmpty()) errors << "Spell animation mappings contain unknown spell ids: ${invalidAnimationKeys}"

                animationMappings.each { key, mapping ->
                    if (!(mapping instanceof Map)) {
                        errors << "Animation mapping for ${key} must be a JSON object"
                        return
                    }
                    def populatedFields = animationFields.findAll { field -> mapping[field] != null && mapping[field].toString() != '' }
                    if (populatedFields.isEmpty()) {
                        errors << "Animation mapping for ${key} must define at least one animation field"
                    }
                    if (key == 'default' || key.toString().startsWith('__')) {
                        ['chant_animation', 'cast_animation', 'continuous_animation'].each { field ->
                            if (mapping[field] == null || mapping[field].toString() == '') {
                                errors << "Animation fallback ${key} must define ${field}"
                            }
                        }
                    }
                    populatedFields.each { field ->
                        def animationName = mapping[field].toString()
                        def animationPath = registeredAnimations[animationName]
                        if (animationPath == null) {
                            errors << "Animation mapping ${key}.${field} references unregistered animation ${animationName}"
                        } else {
                            requireFile(file("src/main/resources/assets/sihriya/animmodels/animations/${animationPath}.json"), "animation asset ${animationName}")
                        }
                    }
                }
            }
        }

        def guide = file('GUIDE-DEV.md').text
        if (!guide.contains('252')) {
            errors << 'GUIDE-DEV.md must document the current 252-spell content set'
        }
        if (guide.contains('126 sorts')) {
            errors << 'GUIDE-DEV.md still documents the obsolete 126-spell content set'
        }

        if (!errors.isEmpty()) {
            throw new GradleException("Sihriya content validation failed:\n - ${errors.join('\n - ')}")
        }
        println "Sihriya content validation passed: ${schools.size()} schools, ${spells.size()} spells."
    }
}

tasks.register('validateSihriyaPackaging') {
    group = 'verification'
    description = 'Validates Sihriya mod metadata, packaging docs, and dependency declarations.'

    doLast {
        def errors = []
        def requireFile = { File f, String label ->
            if (!f.isFile()) {
                errors << "Missing ${label}: ${project.relativePath(f)}"
            } else if (f.text.trim().isEmpty()) {
                errors << "${label} is empty: ${project.relativePath(f)}"
            }
        }
        def requireText = { String text, String expected, String label ->
            if (!text.contains(expected)) errors << "${label} must contain '${expected}'"
        }
        def requireRegex = { String text, String pattern, String label ->
            if (!(text =~ pattern)) errors << label
        }
        def forbiddenStatModRuntimeArtifacts = [
            'parcool',
            'epicparcool',
            'aaa_particles',
            'invincible',
            'epicfight-nightfall',
            'epicfight-extra',
            'epic_fight_avalon',
            'epic-fight-avalon',
            'WeaponsOfMiracles',
            'p1nero_bow'
        ]

        requireFile(file('README.md'), 'README')
        requireFile(file('CHANGELOG.md'), 'changelog')
        requireFile(file('LICENSE'), 'license file')

        if (!(mod_id ==~ /[a-z][a-z0-9_]{1,63}/)) errors << "mod_id must be a valid namespaced id, found ${mod_id}"
        if (!(mod_version ==~ /\d+\.\d+\.\d+([-.+][A-Za-z0-9_.-]+)?/)) errors << "mod_version must be semver-like, found ${mod_version}"
        if (mod_license.toString().trim().isEmpty()) errors << 'mod_license must not be empty'

        def mainClassFile = file('src/main/java/tong/sihriya/Sihriya.java')
        requireFile(mainClassFile, 'mod main class')
        if (mainClassFile.isFile()) {
            def mainClass = mainClassFile.text
            requireText(mainClass, "@Mod(Sihriya.MODID)", 'Sihriya main class')
            requireText(mainClass, "public static final String MODID = \"${mod_id}\";", 'Sihriya MODID constant')
        }
        def commandFile = file('src/main/java/tong/sihriya/command/SihriyaCommand.java')
        requireFile(commandFile, 'Sihriya command registration')
        if (commandFile.isFile()) {
            def commandSource = commandFile.text
            requireText(commandSource, '.requires(SihriyaCommand::canUseCommand)', 'Sihriya root command')
            requireText(commandSource, 'private static boolean canUseCommand(CommandSourceStack source)', 'Sihriya command permission helper')
            requireText(commandSource, 'source.hasPermission(2)', 'Sihriya command permission helper')
        }
        def spellCastHandlerFile = file('src/main/java/tong/sihriya/core/SpellCastHandler.java')
        requireFile(spellCastHandlerFile, 'Sihriya spell cast handler')
        if (spellCastHandlerFile.isFile()) {
            def spellCastSource = spellCastHandlerFile.text
            requireText(spellCastSource, 'ProjectileUtil.getEntityHitResult', 'Sihriya direct spell targeting')
            if (spellCastSource.contains('player.pick(20.0')) {
                errors << 'Sihriya direct spell targeting must not rely on player.pick for entity hits'
            }
            ['case "range_bonus" -> {}', 'case "orbit_damage" -> {}'].each { emptyCase ->
                if (spellCastSource.contains(emptyCase)) {
                    errors << "Sihriya spell effect handler must not leave no-op effect branch: ${emptyCase}"
                }
            }
            ['applyRangeBonus', 'applyOrbitDamageAura'].each { required ->
                requireText(spellCastSource, required, 'Sihriya spell effect handler')
            }
            [
                'TemporaryEffectRules.clampSummonCount(count)',
                'TemporaryEffectRules.clampSummonDuration(duration)',
                'TemporaryEffectRules.summonAngle(i, summonCount)',
                'TemporaryEffectRules.TEMPORARY_SUMMON_TAG',
                'TemporaryEffectRules.SUMMON_CASTER_TAG_PREFIX',
                'TemporaryEffectRules.clampWallDuration(duration)',
                'NetworkInputRules.isValidSchoolId(schoolId, id -> SchoolRegistry.get(id) != null)',
                'SpellCooldownTracker COOLDOWNS = new SpellCooldownTracker()',
                'COOLDOWNS.remainingCooldownTicks(player.getUUID(), spellId, spell.cooldown, now)',
                'COOLDOWNS.recordCast(player.getUUID(), spellId, now)',
                'PlayerEvent.PlayerLoggedOutEvent',
                'COOLDOWNS.clearPlayer(event.getEntity().getUUID())'
            ].each { required ->
                requireText(spellCastSource, required, 'Sihriya temporary spell effect handler')
            }
            ['Math.min(count, 30)', 'duration = 600', 'duration = 1200', 'Map<UUID, Map<String, Long>> cooldowns = new HashMap<>()'].each { forbidden ->
                if (spellCastSource.contains(forbidden)) {
                    errors << "Sihriya temporary spell effect handler must not use raw temporary-effect guard: ${forbidden}"
                }
            }
        }
        def cooldownTrackerFile = file('src/main/java/tong/sihriya/core/SpellCooldownTracker.java')
        requireFile(cooldownTrackerFile, 'Sihriya spell cooldown tracker')
        if (cooldownTrackerFile.isFile()) {
            def cooldownTrackerSource = cooldownTrackerFile.text
            [
                'remainingCooldownTicks',
                'recordCast',
                'clearPlayer',
                'trackedPlayerCount',
                'cooldownsByPlayer'
            ].each { required ->
                requireText(cooldownTrackerSource, required, 'Sihriya spell cooldown tracker')
            }
        }
        def temporaryEffectRulesFile = file('src/main/java/tong/sihriya/core/TemporaryEffectRules.java')
        requireFile(temporaryEffectRulesFile, 'Sihriya temporary effect rules')
        if (temporaryEffectRulesFile.isFile()) {
            def temporaryRulesSource = temporaryEffectRulesFile.text
            [
                'MAX_SUMMON_COUNT',
                'MAX_SUMMON_DURATION_TICKS',
                'MAX_TEMPORARY_BLOCK_TICKS',
                'DEFAULT_SUMMON_DURATION_TICKS',
                'DEFAULT_WALL_DURATION_TICKS',
                'clampSummonCount',
                'clampSummonDuration',
                'clampWallDuration'
            ].each { required ->
                requireText(temporaryRulesSource, required, 'Sihriya temporary effect rules')
            }
        }
        def playerLoginHandlerFile = file('src/main/java/tong/sihriya/core/PlayerLoginHandler.java')
        requireFile(playerLoginHandlerFile, 'Sihriya player sync handler')
        if (playerLoginHandlerFile.isFile()) {
            def playerSyncSource = playerLoginHandlerFile.text
            [
                'public static void syncPlayer(ServerPlayer player)',
                'PlayerEvent.PlayerLoggedInEvent',
                'PlayerEvent.PlayerRespawnEvent',
                'PlayerEvent.PlayerChangedDimensionEvent',
                'syncPlayer(serverPlayer)',
                'new ManaSyncPacket',
                'new SchoolSyncPacket'
            ].each { required ->
                requireText(playerSyncSource, required, 'Sihriya player sync handler')
            }
        }
        def schoolProgressionFile = file('src/main/java/tong/sihriya/core/SchoolProgression.java')
        requireFile(schoolProgressionFile, 'Sihriya school progression persistence')
        if (schoolProgressionFile.isFile()) {
            def schoolProgressionSource = schoolProgressionFile.text
            [
                'ProgressionStateRules.sanitize',
                'new ProgressionStateRules.StoredState',
                'SchoolRegistry.get(id) != null',
                'SpellRegistry.get(spellId)',
                'public Set<String> getLearnedSpells() { return Set.copyOf(learnedSpells); }',
                'public Set<String> getUnlockedSchools() { return Set.copyOf(unlockedSchools); }'
            ].each { required ->
                requireText(schoolProgressionSource, required, 'Sihriya school progression persistence')
            }
        }
        def schoolRegistryFile = file('src/main/java/tong/sihriya/data/SchoolRegistry.java')
        requireFile(schoolRegistryFile, 'Sihriya school registry')
        if (schoolRegistryFile.isFile()) {
            def schoolRegistrySource = schoolRegistryFile.text
            [
                'List.copyOf(SCHOOLS.values())',
                'this.schoolIds = schoolIds.clone()',
                'this.levels = levels.clone()',
                'public String[] schoolIds()',
                'public int[] levels()'
            ].each { required ->
                requireText(schoolRegistrySource, required, 'Sihriya school registry')
            }
        }
        def spellRegistryFile = file('src/main/java/tong/sihriya/data/SpellRegistry.java')
        requireFile(spellRegistryFile, 'Sihriya spell registry')
        if (spellRegistryFile.isFile()) {
            def spellRegistrySource = spellRegistryFile.text
            [
                'List.copyOf(SPELLS.values())',
                'this.type = type; this.effects = List.copyOf(effects);'
            ].each { required ->
                requireText(spellRegistrySource, required, 'Sihriya spell registry')
            }
        }
        def progressionStateRulesFile = file('src/main/java/tong/sihriya/core/ProgressionStateRules.java')
        requireFile(progressionStateRulesFile, 'Sihriya progression state rules')
        if (progressionStateRulesFile.isFile()) {
            def progressionRulesSource = progressionStateRulesFile.text
            [
                'sanitize',
                'clampLevel',
                'clampXp',
                'StoredState',
                'level >= 100'
            ].each { required ->
                requireText(progressionRulesSource, required, 'Sihriya progression state rules')
            }
        }
        def modEffectsFile = file('src/main/java/tong/sihriya/core/ModEffects.java')
        requireFile(modEffectsFile, 'Sihriya custom effects')
        if (modEffectsFile.isFile()) {
            def modEffectsSource = modEffectsFile.text
            requireText(modEffectsSource, 'SpellEffectRules.shouldRevokeMagicFlight(player.isCreative(), player.isSpectator())', 'Sihriya magic flight cleanup')
            if (modEffectsSource.contains('player.getAbilities().mayfly = false;\n                player.getAbilities().flying = false;')) {
                errors << 'Sihriya magic flight cleanup must not revoke flight without checking creative/spectator'
            }
        }
        def manaManagerFile = file('src/main/java/tong/sihriya/core/ManaManager.java')
        requireFile(manaManagerFile, 'Sihriya mana manager')
        if (manaManagerFile.isFile()) {
            def manaManagerSource = manaManagerFile.text
            requireText(manaManagerSource, 'ManaInteropRules.remainingManaLockMs(stats.getManaBlockRemainingTicks())', 'Sihriya mana manager')
            if (manaManagerSource.contains('getManaBlockRemainingMs()')) {
                errors << 'Sihriya mana manager must not call removed STAT_MOD API getManaBlockRemainingMs()'
            }
        }
        def manaInteropRulesFile = file('src/main/java/tong/sihriya/core/ManaInteropRules.java')
        requireFile(manaInteropRulesFile, 'Sihriya mana interop rules')
        if (manaInteropRulesFile.isFile()) {
            def manaInteropSource = manaInteropRulesFile.text
            ['remainingManaLockMs', 'remainingTicks', '* 50L'].each { required ->
                requireText(manaInteropSource, required, 'Sihriya mana interop rules')
            }
        }
        def clientSchoolDataFile = file('src/main/java/tong/sihriya/client/ClientSchoolData.java')
        requireFile(clientSchoolDataFile, 'Sihriya client school cache')
        if (clientSchoolDataFile.isFile()) {
            def clientSchoolDataSource = clientSchoolDataFile.text
            [
                'private static String activeSchool = ""',
                'private static Map<String, Integer> schoolLevels = new HashMap<>()',
                'private static Set<String> unlockedSchools = new HashSet<>()',
                'private static Set<String> learnedSpells = new HashSet<>()',
                'public static String getActiveSchool()',
                'public static boolean isSpellLearned(String spellId)',
                'schoolLevels = new HashMap<>(levels);',
                'unlockedSchools = new HashSet<>(unlocked);',
                'learnedSpells = new HashSet<>(spells);'
            ].each { required ->
                requireText(clientSchoolDataSource, required, 'Sihriya client school cache')
            }
            ['public static String activeSchool', 'public static Set<String> learnedSpells'].each { forbidden ->
                if (clientSchoolDataSource.contains(forbidden)) {
                    errors << "Sihriya client school cache must not expose mutable sync state: ${forbidden}"
                }
            }
        }
        ['src/main/java/tong/sihriya/client/gui/ActiveSpellHud.java',
         'src/main/java/tong/sihriya/client/gui/GrimoireScreen.java',
         'src/main/java/tong/sihriya/client/gui/ManaOverlay.java'].each { path ->
            def clientUiFile = file(path)
            if (clientUiFile.isFile()) {
                def clientUiSource = clientUiFile.text
                ['ClientSchoolData.activeSchool', 'ClientSchoolData.learnedSpells'].each { forbidden ->
                    if (clientUiSource.contains(forbidden)) {
