                }
            }
        }
        def epicFightAliasRegistryFile = file('src/main/java/tong/sihriya/epicfight/EpicFightAliasSkillRegistry.java')
        requireFile(epicFightAliasRegistryFile, 'Epic Fight alias skill registry')
        if (epicFightAliasRegistryFile.isFile()) {
