        def efnExampleAliasSkillFile = file('src/main/java/tong/sihriya/epicfight/EfnExampleAliasSkill.java')
        requireFile(efnExampleAliasSkillFile, 'Epic Fight alias skill implementation')
        if (efnExampleAliasSkillFile.isFile()) {
